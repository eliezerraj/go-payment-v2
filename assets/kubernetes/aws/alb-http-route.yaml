apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-inventory-v2-route
  namespace: test-a
  labels:
    app: go-inventory-v2-route
spec:
  hostnames:
    - "go-inventory-v2.architecturedev.xpto.io"
  parentRefs:
    - name: alb-arch-eks-002-gateway
      namespace: test-a
      sectionName: http-listener
    - name: alb-arch-eks-002-gateway
      namespace: test-a
      sectionName: https-listener
  rules:
    - matches:
      - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svc-go-inventory-v2
          port: 7000
          namespace: test-a