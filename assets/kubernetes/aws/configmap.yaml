apiVersion: v1
kind: ConfigMap
metadata:
  name: &app-name cm-go-payment-v2
  namespace: test-a
  labels:
    app: *app-name
data:
  APP_NAME: "go-payment-v2.eks-002"
  VERSION: "1.0"
  ACCOUNT: "aws:992382474575"
  ENV: "dev"
  TYPE: "webserver"

  HTTP_TIMEOUT: "120s"
  HTTP_KEEP_ALIVE: "120s"
  HTTP_READTIMEOUT: "120s"
  HTTP_WRITETIMEOUT: "120s"
  HTTP_IDLECONNTIMEOUT: "120s"
  HTTP_MAXIDLECONNS: "2"
  HTTP_MAXIDLECONNSPERHOST: "2"
  HTTP_MAXCONNSPERHOST: "2"
  HTTP_PORT: "7003"
  READ_BUFFER_SIZE: "12288"
  DISABLE_STARTUP_MESSAGE: "true"

  DB_HOST: "rds-proxy-db-arch-02.proxy-cj4aqa08ettf.us-east-2.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
  DB_NAME: "postgres"
  DB_SCHEMA: "public"
  DATABASE_QUERY_TRACER: "false"
  DB_MAX_CONNS: "5" 
  DB_MIN_CONNS: "5" 
  DB_CONNECTION_TIMEOUT_DURATION: "4s"
  DB_LIFE_TIME_CONNS: "28s"
  DB_IDLE_TIME_CONNS: "1s"

  LOG_LEVEL: "info" #info, error, warning
  LOG_MODE: "json"

  AUTHORIZATION_DRY_RUN: "false"
  AUTHORIZATION_POLICY_PATH: "/app/application/infrastructure/auth/policy/policy.cedar"
  AUTHORIZATION_TIMEOUT: "15s"
  AUTHORIZATION_JWKS_URL: "https://go-authorizer-v2.architecture.xpto.io/v1/.well-known/jwks.json"
  AUTHORIZATION_HEADER_KEY: "Authorization"
  AUTHORIZATION_REQUIRED_HEADER: "false"

  OTEL_EXPORTER_OTLP_ENDPOINT: "arch-eks-002-otel-collector.default.svc.cluster.local:4317"
  OTEL_METRICS_PORT: "8003"

  KAFKA_EVENT_DRY_RUN: "false"
  KAFKA_PRODUCER_NAME: "payment-producer.eks"
  KAFKA_PRODUCER_BROKER: "b-1.mskarch01.x25pj7.c3.kafka.us-east-2.amazonaws.com:9096,b-2.mskarch01.x25pj7.c3.kafka.us-east-2.amazonaws.com:9096,b-3.mskarch01.x25pj7.c3.kafka.us-east-2.amazonaws.com:9096"
  KAFKA_PRODUCER_TOPIC: "kfk.order.checkout.payment"
  KAFKA_PRODUCER_PROTOCOL: "SASL_SSL"
  KAFKA_PRODUCER_MECHANISM: "SCRAM-SHA-512"
  KAFKA_PRODUCER_USERNAME: "admin"
  KAFKA_PRODUCER_PASSWORD: "admin"