apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-payment-v2-route
  namespace: test-a
  labels:
    app: go-payment-v2-route
spec:
  hostnames:
    - "go-payment-v2.architecturedev.x.io"
  parentRefs:
    - name: alb-arch-eks-002-gateway
      namespace: test-a
      sectionName: http-listener
    - name: alb-arch-eks-002-gateway
      namespace: test-a
      sectionName: https-listener
  rules:
    - matches:
      - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: svc-go-payment-v2
          port: 7003
          namespace: test-a
          weight: 1

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go-payment-v2-route-metrics
  namespace: test-a
  labels:
    app: go-payment-v2-route-metrics
spec:
  hostnames:
    - "go-payment-v2.architecturedev.x.io"
  parentRefs:
    - name: alb-arch-eks-002-gateway
      namespace: test-a
      sectionName: http-listener
    - name: alb-arch-eks-002-gateway
      namespace: test-a
      sectionName: https-listener
  rules:
    - matches:
      - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: svc-go-payment-v2-metrics
          port: 8003
          namespace: test-a
          weight: 1