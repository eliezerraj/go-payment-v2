apiVersion: v1
kind: Service
metadata:
  name: &app-name svc-go-payment-v2
  namespace: test-a
  labels:
    app: *app-name
spec:
  type: ClusterIP
  ports:
  - port: 7003
    targetPort: 7003
    protocol: TCP
    name: http
  selector:
    app: go-payment-v2

---

apiVersion: v1
kind: Service
metadata:
  name: &app-name svc-go-payment-v2-metrics
  namespace: test-a
  labels:
    app: *app-name
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    protocol: TCP
    name: metrics
  selector:
    app: go-payment-v2