components:
  schemas:
    Credential:
      type: object
      example:
        credential_id: 'db-arch-02'
      properties:
        credential_id:
          type: string
          description: Credential ID of the credential to retrieve.
          example: 'db-arch-02'  

    GroupCredential:
      type: object
      example:
        group_id: 'db-arch-02'
      properties:
        group_id:
          type: string
          description: Group ID of the group credential to retrieve.
          example: 'pier'
