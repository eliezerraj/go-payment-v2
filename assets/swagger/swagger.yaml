  /payment:
    post:
      tags:
        - Payment
      summary: Create a new payment
      description: 'Creates a new payment with the provided details.'
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: (Mandatory) Authorization token for authentication.
        - in: header
          name: X-Request-ID
          required: false
          schema:
            type: string
          description: (Optional) request ID for tracking the request. Strongly recommended to provide it. Always use the X-Request-ID already propagated in request headers. If not provided, a random UUID will be generated and used for tracking. 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_id:
                  type: string
                  description: Transaction ID for the payment
                  example: '123'
                type:
                  type: string
                  description: Payment type
                  example: 'credit_card'
                order:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    order_number:
                      type: string
                      example: 'ord-001'
                payment_detail:
                  type: array
                  items:
                    type: object
                    properties:
                      currency:
                        type: string
                        example: 'BRL'
                      amount:
                        type: number
                        example: 120.00
                      credit_card:
                        type: object
                        properties:
                          pan:
                            type: string
                            example: '1111.1111.1111.1111'
                          holder:
                            type: string
                            example: 'juliana'
                          password:
                            type: string
                            example: 'qwerty'
                          cvv:
                            type: string
                            example: '123'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: 'Payment added successfully'
                  payment:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                      payment_number:
                        type: string
                        example: 'pay:ord-001'
                      transaction_id:
                        type: string
                        example: '123'
                      type:
                        type: string
                        example: 'credit_card'
                      order:
