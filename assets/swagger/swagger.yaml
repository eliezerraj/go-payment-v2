                                cvv:
                                  type: string
                                  example: '123'
                            created_at:
                              type: string
                              format: date-time
                              example: '2026-09-13T02:26:54.812415732Z'
                      created_at:
                        type: string
                        format: date-time
                        example: '2026-09-13T02:26:54.812415732Z'
