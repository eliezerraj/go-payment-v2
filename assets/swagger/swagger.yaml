openapi: 3.0.3
info:
  title: Payment Service
  description: API for managing sessions of the payment service. (Date 2026-08-18)
  version: 1.0.0
servers:
  - url: 'https://go-payment-v2/v1'
paths:
  /info:
    get:
      tags:
        - Payment
      summary: Get some basic information about the payment service
      description: 'Retrieves some basic information about the payment service.'
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          schema:
            type: string
          description: (Optional) request ID for tracking the request. Strongly recommended to provide it. Always use the X-Request-ID already propagated in request headers. If not provided, a random UUID will be generated and used for tracking. 
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: object
                    properties:
                      App:
                        type: object
                        properties:
                          Name:
                            type: string
                            example: go-payment-v2
                          Version:
                            type: string
                            example: '2.0'
                          Env:
                            type: string
                            example: dev
                          Account:
                            type: string
                            example: local:localhost
                          Type:
                            type: string
                            example: webserver
                      HTTP:
                        type: object
                        properties:
                          Timeout:
                            type: integer
                            example: 120000000000
                          KeepAlive:
                            type: integer
                            example: 120000000000
                          ReadTimeout:
                            type: integer
                            example: 120000000000
                          WriteTimeout:
                            type: integer
                            example: 120000000000
                          IdleConnTimeout:
                            type: integer
                            example: 120000000000
                          MaxIdleConns:
                            type: integer
                            example: 2
                          MaxIdleConnsPerHost:
                            type: integer
                            example: 2
                          MaxConnsPerHost:
                            type: integer
                            example: 2
                          Port:
                            type: string
                            example: '7003'
                          ReadBufferSize:
                            type: integer
                            example: 12288
                          DisableStartupMessage:
                            type: boolean
                            example: true
                      Database:
                        type: object
                        properties:
                          DSN:
                            type: string
                            example: host=127.0.0.1 port=5432 database=postgres
                          Host:
                            type: string
                            example: 127.0.0.1
                          Port:
                            type: string
                            example: '5432'
                          Username:
                            type: string
                            example: postgres
                          Password:
                            type: string
                            example: postgres
                          Name:
                            type: string
                            example: postgres
                          Schema:
                            type: string
                            example: public
                          QueryTracer:
                            type: boolean
                            example: false
                          MaxConnections:
                            type: integer
                            example: 10
                          MinConnections:
                            type: integer
                            example: 5
                          ConnTimeout:
                            type: integer
                            example: 5000000000
                          ConnLifetime:
                            type: integer
                            example: 86400000000000
                          ConnIdleTime:
                            type: integer
                            example: 3600000000000
                          MaxConnLifetimeJitter:
                            type: integer
                            example: 120000000000
                          HealthCheckTimeout:
                            type: integer
                            example: 15000000000
                      Scopes:
                        type: object
                        properties:
                          AllowedScopes:
                            type: string
                            example: workload01:db-01,workload01:db-02
                      Log:
                        type: object
                        properties:
                          Level:
                            type: string
                            example: debug
                          Mode:
                            type: string
                            example: json
                      OtelEnv:
                        type: object
                        properties:
                          OtelExportEndpoint:
                            type: string
                            example: 127.0.0.1:4317
                          UseStdoutTracerExporter:
                            type: boolean
                            example: false
                          UseOtlpCollector:
                            type: boolean
                            example: false
                          OtelMetricsPort:
                            type: string
                            example: '8003'
                      Authorization:
                        type: object
                        properties:
                          HeaderKey:
                            type: string
                            example: Authorization
                          DryRun:
                            type: boolean
                            example: false
                          JwksURL:
                            type: string
                            example: http://localhost:7100/v1/.well-known/jwks.json
                          RequiredAuthHeader:
                            type: boolean
                            example: true
                          Timeout:
                            type: integer
                            example: 15000000000
                      KafkaProducer:
                        type: object
                        properties:
                          BrokerList:
                            type: string
                            example: localhost:9092
                          Topic:
                            type: string
                            example: payment.topic.01
                          Protocol:
                            type: string
                            example: SASL_PLAINTEXT
                          Mechanism:
                            type: string
                            example: PLAIN
                          Username:
                            type: string
                            example: admin
                          Password:
                            type: string
                            example: admin
                          Name:
                            type: string
                            example: payment-producer.local
                          DryRun:
                            type: boolean
                            example: true
                      Inventory:
                        type: object
                        properties:
                          Endpoint:
                            type: string
                            example: ''
                          UrlPath:
                            type: string
                            example: ''
                          Timeout:
                            type: integer
                            example: 0

  /payment/order/{order_id}:
    get:
      tags:
        - Payment
      summary: Get payments for an order
      description: 'Retrieves all payments associated with a given order ID.'
      parameters:
        - in: path
          name: order_id
          required: true
          schema:
            type: string
          description: The order ID to retrieve payments for
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: (Mandatory) Authorization token for authentication.
        - in: header
          name: X-Request-ID
          required: false
          schema:
            type: string
          description: (Optional) request ID for tracking the request. Strongly recommended to provide it. Always use the X-Request-ID already propagated in request headers. If not provided, a random UUID will be generated and used for tracking. 
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    example: 'Payments retrieved successfully'
                  payment:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 33
                        payment_number:
                          type: string
                          example: 'pay:ord-116'
                        transaction_id:
                          type: string
                          example: 'txn:ord-116'
                        type:
                          type: string
                          example: 'credit_card'
                        order:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 17
                            order_number:
                              type: string
                              example: '17'
                        payment_detail:
                          type: array
                          items:
                            type: object
                            properties:
                              payment_detail_date:
                                type: string
                                format: date-time
                                example: '0001-01-01T00:00:00Z'
                              currency:
                                type: string
                                example: 'BRL'
                              amount:
                                type: number
                                example: 100
                              credit_card:
                                type: object
                                properties:
                                  pan:
                                    type: string
                                    example: '2222.2222.2222.2222'
                                  holder:
                                    type: string
                                    example: 'Lucas'
                              created_at:
                                type: string
                                format: date-time
                                example: '2026-09-06T17:24:22.702972-03:00'
                        created_at:
                          type: string
                          format: date-time
                          example: '2026-09-06T17:24:22.702972-03:00'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: '25257782-9de3-4c2d-937a-3c56c02a24cc'
                      code:
                        type: string
                        example: 'Bad Request'
                      description:
                        type: string
                        example: 'Invalid input parameters'
                  status_code:
                    type: integer
                    example: 400
                  type:
                    type: string
                    example: 'business_error'
                  reason:
                    type: string
                    example: 'Invalid request parameters'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: '25257782-9de3-4c2d-937a-3c56c02a24cc'
                      code:
                        type: string
                        example: 'Unauthorized'
                      description:
                        type: string
                        example: 'Authentication failed'
                  status_code:
                    type: integer
                    example: 401
                  type:
                    type: string
                    example: 'business_error'
                  reason:
                    type: string
                    example: 'Access denied, check your credentials'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: '25257782-9de3-4c2d-937a-3c56c02a24cc'
                      code:
                        type: string
                        example: 'Forbidden'
                      description:
                        type: string
                        example: 'Access forbidden'
                  status_code:
                    type: integer
                    example: 403
                  type:
                    type: string
                    example: 'business_error'
                  reason:
                    type: string
                    example: 'Insufficient permissions'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: '25257782-9de3-4c2d-937a-3c56c02a24cc'
