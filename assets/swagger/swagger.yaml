                          type: string
                          example: '1234567890'
                        host:
                          type: string
                          example: 'db-arch-02.aaaaaaa.us-east-2.rds.amazonaws.com'
                        port:
                          type: integer
                          example: 5434
                        username:
                          type: string
                          example: 'user-admin'
                        password:
                          type: string
                          example: 'mysecretpassword'
                    example:
                      - issuer_id: '100'
                        provider: 'aws'
                        account_id: '1234567890'
                        host: 'db-arch-02.aaaaaaa.us-east-2.rds.amazonaws.com'
                        port: 5434
                        username: 'user-admin'
                        password: 'mysecretpassword'
                      - issuer_id: '101'
